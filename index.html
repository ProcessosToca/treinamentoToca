<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Projeto Estoque Toca</title>
<style>
  :root {
    --papel: #FFFFFF;
    --fundo: #F4F4F4;
    --linha: #E2E2E2;
    --suave: #6B6B6B;
    --tinta: #2B2B2B;
    --toca: #AA1818;
    --toca-escuro: #8C1212;
    --feito: #2E7D32;
    --feito-fundo: #EAF4EB;
    --raio: 10px;
    --topo: 60px;
    --lateral: 272px;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: calc(var(--topo) + 16px); }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    color: var(--tinta);
    background: var(--fundo);
    -webkit-text-size-adjust: 100%;
  }
  h1, h2, h3, p, ul, ol { margin: 0; }
  ul, ol { padding: 0; list-style: none; }
  a { color: var(--toca); }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--tinta); outline-offset: 2px; border-radius: 4px; }

  /* ---------- Cabeçalho ---------- */
  .topo {
    position: fixed; inset: 0 0 auto 0; height: var(--topo); z-index: 30;
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px;
    background: var(--papel);
    border-bottom: 1px solid var(--linha);
  }
  .marca { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--tinta); min-width: 0; }
  .marca img { height: 34px; width: auto; display: block; }
  .marca .nome-toca { font-weight: 700; font-size: 19px; letter-spacing: -0.02em; color: var(--toca); white-space: nowrap; }
  .marca .projeto { padding-left: 12px; border-left: 1px solid var(--linha); font-size: 15px; color: var(--suave); white-space: nowrap; }
  .topo .espaco { flex: 1; }
  .andamento { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--suave); white-space: nowrap; }
  .barra { width: 120px; height: 6px; border-radius: 99px; background: var(--linha); overflow: hidden; }
  .barra i { display: block; height: 100%; width: 0; background: var(--feito); border-radius: 99px; transition: width .3s ease; }
  .botao {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 9px 16px; border-radius: 8px; border: 1px solid var(--linha);
    background: var(--papel); font-size: 14px; font-weight: 700; text-decoration: none; color: var(--tinta);
  }
  .botao:hover { border-color: #BDBDBD; }
  .botao.principal { background: var(--toca); border-color: var(--toca); color: #fff; }
  .botao.principal:hover { background: var(--toca-escuro); border-color: var(--toca-escuro); }
  .botao-menu { display: none; }

  /* ---------- Menu lateral ---------- */
  .lateral {
    position: fixed; top: var(--topo); bottom: 0; left: 0; width: var(--lateral); z-index: 20;
    overflow-y: auto; padding: 20px 0 32px;
    background: var(--papel); border-right: 1px solid var(--linha);
  }
  .lateral .grupo { padding: 0 20px 6px; margin-top: 18px; font-size: 13px; color: var(--suave); }
  .lateral .grupo:first-child { margin-top: 0; }
  .lateral a {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 20px 9px 17px; border-left: 3px solid transparent;
    color: var(--tinta); text-decoration: none; font-size: 15px; line-height: 1.3;
  }
  .lateral a:hover { background: var(--fundo); }
  .lateral a[aria-current="page"] { border-left-color: var(--toca); background: var(--fundo); font-weight: 700; }
  .lateral .fase-n {
    flex: none; width: 24px; height: 24px; border-radius: 50%;
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
    border: 1.5px solid #BDBDBD; color: var(--suave); background: var(--papel);
  }
  .lateral a.completa .fase-n { background: var(--feito); border-color: var(--feito); color: #fff; }
  .lateral .rotulo { flex: 1; min-width: 0; }
  .lateral .conta { font-size: 12px; color: var(--suave); font-weight: 400; font-variant-numeric: tabular-nums; }

  /* ---------- Área principal ---------- */
  main { margin-left: var(--lateral); padding: calc(var(--topo) + 36px) 40px 80px; outline: none; }
  .folha { max-width: 860px; }
  .folha.larga { max-width: 1040px; }
  h1 { font-size: clamp(28px, 4vw, 40px); line-height: 1.1; letter-spacing: -0.03em; }
  h2 { font-size: 22px; line-height: 1.2; letter-spacing: -0.02em; margin-top: 44px; }
  h3 { font-size: 17px; line-height: 1.3; }
  .abre { font-size: 18px; color: #4A4A4A; margin-top: 14px; max-width: 62ch; }
  .texto { max-width: 68ch; margin-top: 12px; }
  .miudo { font-size: 14px; color: var(--suave); }

  /* Início */
  .capa { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 40px; align-items: center; }
  .capa .acoes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
  .proximo { margin-top: 22px; padding: 14px 16px; border-radius: var(--raio); background: var(--papel); border: 1px solid var(--linha); font-size: 15px; }
  .proximo b { display: block; font-size: 13px; font-weight: 400; color: var(--suave); }
  .nome-campo { margin-top: 18px; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--suave); }
  .nome-campo input { font: inherit; font-size: 15px; color: var(--tinta); padding: 7px 10px; border: 1px solid #CFCFCF; border-radius: 8px; width: 200px; background: var(--papel); }

  .trilha { margin-top: 18px; background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio); overflow: hidden; }
  .trilha a { display: grid; grid-template-columns: 34px minmax(0, 1fr) 150px; gap: 14px; align-items: center; padding: 14px 18px; text-decoration: none; color: var(--tinta); border-top: 1px solid var(--linha); }
  .trilha a:first-child { border-top: 0; }
  .trilha a:hover { background: #FAFAFA; }
  .trilha .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; border: 1.5px solid #BDBDBD; color: var(--suave); }
  .trilha a.completa .n { background: var(--feito); border-color: var(--feito); color: #fff; }
  .trilha .t { font-weight: 700; }
  .trilha .s { font-size: 14px; color: var(--suave); }
  .trilha .p { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--suave); font-variant-numeric: tabular-nums; }
  .trilha .p .barra { flex: 1; width: auto; }

  .regras { margin-top: 16px; display: grid; gap: 10px; max-width: 68ch; }
  .regras li { padding-left: 18px; position: relative; }
  .regras li::before { content: ""; position: absolute; left: 0; top: .62em; width: 7px; height: 7px; border-radius: 50%; background: var(--toca); }

  /* Destaque */
  .destaque { margin-top: 20px; padding: 16px 18px; background: var(--papel); border-left: 4px solid var(--toca); border-radius: 0 var(--raio) var(--raio) 0; max-width: 68ch; }

  /* Bloco para copiar */
  .copiavel { margin-top: 16px; background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio); max-width: 76ch; }
  .copiavel pre { margin: 0; padding: 18px; white-space: pre-wrap; font-family: Arial, Helvetica, sans-serif; font-size: 15px; line-height: 1.55; }
  .copiavel .pe { display: flex; justify-content: flex-end; padding: 10px 12px; border-top: 1px solid var(--linha); background: #FAFAFA; border-radius: 0 0 var(--raio) var(--raio); }

  .duas { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 860px; }
  .lista-pode { background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio); padding: 16px 18px; }
  .lista-pode h3 { margin-bottom: 8px; }
  .lista-pode.sim h3 { color: var(--feito); }
  .lista-pode.nao h3 { color: var(--toca); }
  .lista-pode li { padding: 7px 0; border-top: 1px solid var(--linha); font-size: 15px; }
  .lista-pode li:first-child { border-top: 0; }

  /* Cores */
  .proporcao { margin-top: 18px; display: flex; height: 54px; border-radius: var(--raio); overflow: hidden; border: 1px solid var(--linha); max-width: 760px; }
  .proporcao span { display: flex; align-items: flex-end; padding: 6px 10px; font-size: 12px; }
  .cores { margin-top: 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; max-width: 760px; }
  .cor { display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; text-align: left; padding: 0; border: 1px solid var(--linha); border-radius: var(--raio); background: var(--papel); overflow: hidden; }
  .cor:hover { border-color: #BDBDBD; }
  .cor i { display: block; height: 74px; border-bottom: 1px solid var(--linha); }
  .cor b { display: block; padding: 10px 12px 0; font-size: 15px; }
  .cor code { display: block; padding: 0 12px; font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: var(--suave); }
  .cor small { display: block; padding: 6px 12px 12px; font-size: 13px; color: var(--suave); line-height: 1.35; }

  /* ---------- Telas esperadas (mockups) ---------- */
  .abas { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 6px; }
  .abas button { padding: 8px 14px; border-radius: 99px; border: 1px solid var(--linha); background: var(--papel); font-size: 14px; }
  .abas button[aria-selected="true"] { background: var(--tinta); border-color: var(--tinta); color: #fff; font-weight: 700; }
  .vitrine { margin-top: 14px; display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  .precisa { background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio); padding: 16px 18px; }
  .precisa li { padding: 8px 0 8px 22px; border-top: 1px solid var(--linha); font-size: 15px; position: relative; }
  .precisa li:first-child { border-top: 0; }
  .precisa li::before { content: ""; position: absolute; left: 2px; top: 1.05em; width: 9px; height: 5px; border-left: 2px solid var(--toca); border-bottom: 2px solid var(--toca); transform: rotate(-45deg); }

  .mock { container-type: inline-size; border: 1px solid #CFCFCF; border-radius: 12px; overflow: hidden; background: var(--papel); }
  .mock-barra { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: #EDEDED; border-bottom: 1px solid #D6D6D6; }
  .mock-barra i { width: 9px; height: 9px; border-radius: 50%; background: #C4C4C4; }
  .mock-barra span { margin-left: 8px; flex: 1; padding: 3px 10px; border-radius: 99px; background: var(--papel); font-size: 11px; color: var(--suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mock-tela { font-size: clamp(5px, 1.55cqw, 13px); aspect-ratio: 16 / 10; display: flex; flex-direction: column; background: #F4F4F4; color: #333; line-height: 1.35; overflow: hidden; }
  .m-topo { flex: none; height: 4.4em; display: flex; align-items: center; gap: 1.2em; padding: 0 1.8em; background: #fff; border-bottom: 1px solid #E2E2E2; }
  .m-logo { font-weight: 700; font-size: 1.35em; letter-spacing: -0.02em; color: #AA1818; }
  .m-logo img { height: 2em; width: auto; display: block; }
  .m-topo .m-sis { color: #6B6B6B; padding-left: 1.2em; border-left: 1px solid #E2E2E2; }
  .m-topo .m-user { margin-left: auto; display: flex; align-items: center; gap: 1em; color: #6B6B6B; }
  .m-topo .m-user b { color: #333; }
  .m-corpo { flex: 1; display: flex; min-height: 0; }
  .m-menu { flex: none; width: 15.5em; padding: 1.2em 0; background: #fff; border-right: 1px solid #E2E2E2; }
  .m-menu span { display: block; padding: .8em 1.5em; border-left: .3em solid transparent; }
  .m-menu span.ativo { border-left-color: #AA1818; background: #F4F4F4; font-weight: 700; }
  .m-pag { flex: 1; min-width: 0; padding: 2em 2.4em; }
  .m-cab { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.4em; }
  .m-cab b { font-size: 1.7em; letter-spacing: -0.02em; }
  .m-btn { display: inline-block; padding: .7em 1.3em; border-radius: .6em; background: #AA1818; color: #fff; font-weight: 700; }
  .m-btn.claro { background: #fff; color: #333; border: 1px solid #CFCFCF; }
  .m-cartao { background: #fff; border: 1px solid #E2E2E2; border-radius: .9em; overflow: hidden; }
  .m-tab { width: 100%; border-collapse: collapse; }
  .m-tab th { text-align: left; padding: .8em 1.2em; background: #F4F4F4; font-size: .92em; color: #6B6B6B; font-weight: 700; }
  .m-tab td { padding: .8em 1.2em; border-top: 1px solid #E2E2E2; }
  .m-tab .num { text-align: right; font-variant-numeric: tabular-nums; }
  .m-tag { display: inline-block; margin-left: .6em; padding: .15em .7em; border-radius: 99px; background: #F7E3E3; color: #AA1818; font-size: .85em; font-weight: 700; }
  .m-form { padding: 1.6em 1.8em; display: grid; grid-template-columns: 1fr 1fr; gap: 1.2em 1.6em; }
  .m-campo { display: grid; gap: .4em; }
  .m-campo.inteiro { grid-column: 1 / -1; }
  .m-campo label { font-size: .92em; color: #6B6B6B; }
  .m-campo .cx { height: 2.9em; padding: 0 .9em; display: flex; align-items: center; justify-content: space-between; border: 1px solid #CFCFCF; border-radius: .6em; background: #fff; color: #9A9A9A; }
  .m-campo .cx.cheia { color: #333; }
  .m-acoes { grid-column: 1 / -1; display: flex; gap: .8em; }
  .m-radios { display: flex; gap: 1.6em; height: 2.9em; align-items: center; }
  .m-radios span { display: flex; align-items: center; gap: .5em; }
  .m-radios i { width: 1.2em; height: 1.2em; border-radius: 50%; border: 1px solid #9A9A9A; background: #fff; }
  .m-radios i.on { border: .38em solid #AA1818; }
  .m-login { flex: 1; display: grid; place-items: center; }
  .m-login .m-cartao { width: 27em; padding: 2.6em 2.4em; display: grid; gap: 1.2em; }
  .m-login .m-logo { font-size: 1.9em; text-align: center; }
  .m-login .m-logo img { height: 2.2em; margin: 0 auto; }
  .m-login .sub { text-align: center; color: #6B6B6B; margin-top: -.6em; }
  .m-login .m-btn { text-align: center; padding: .9em; }
  .m-sub { margin: 1.4em 0 .7em; font-weight: 700; }

  /* ---------- Fases e passos ---------- */
  .fase-topo .selo { display: inline-block; font-size: 14px; color: var(--suave); margin-bottom: 8px; }
  .fase-dados { margin-top: 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio); max-width: 860px; }
  .fase-dados div { padding: 14px 18px; border-left: 1px solid var(--linha); }
  .fase-dados div:first-child { border-left: 0; }
  .fase-dados span { display: block; font-size: 13px; color: var(--suave); }
  .fase-dados b { font-size: 15px; }
  .aviso { margin-top: 18px; padding: 12px 16px; border-radius: var(--raio); background: #FFF6E5; border: 1px solid #F0DDB5; font-size: 15px; max-width: 860px; }

  .passos { margin-top: 28px; position: relative; }
  .passo { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 18px; padding-bottom: 26px; position: relative; }
  .passo::before { content: ""; position: absolute; left: 25px; top: 52px; bottom: 0; width: 2px; background: var(--linha); }
  .passo:last-child::before { display: none; }
  .passo-num { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; background: var(--papel); border: 2px solid #BDBDBD; color: var(--suave); font-variant-numeric: tabular-nums; }
  .passo.feito .passo-num { background: var(--feito); border-color: var(--feito); color: #fff; }
  .passo.feito::before { background: var(--feito); }
  .passo-corpo { background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio); padding: 18px 20px; min-width: 0; }
  .passo.feito .passo-corpo { border-color: #BFDCC2; }
  .passo-corpo .controle { display: inline-block; margin-bottom: 8px; padding: 2px 10px; border-radius: 99px; background: var(--tinta); color: #fff; font-size: 12px; font-weight: 700; }
  .passo-corpo p { margin-top: 8px; max-width: 66ch; }
  .passo-corpo code { font-family: Arial, Helvetica, sans-serif; font-weight: 700; background: var(--fundo); padding: 1px 6px; border-radius: 5px; font-size: .95em; }
  .pronto { margin-top: 14px !important; padding: 10px 14px; background: var(--fundo); border-radius: 8px; font-size: 15px; }
  .marcar { margin-top: 14px; display: inline-flex; align-items: center; gap: 10px; padding: 9px 14px 9px 10px; border: 1px solid #CFCFCF; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; user-select: none; background: var(--papel); }
  .marcar input { width: 20px; height: 20px; margin: 0; accent-color: var(--feito); cursor: pointer; }
  .passo.feito .marcar { background: var(--feito-fundo); border-color: #BFDCC2; color: var(--feito); }

  .videos { margin-top: 14px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); align-items: start; }
  .video.tocando, .video.sem { grid-column: 1 / -1; }
  .video { border: 1px solid var(--linha); border-radius: var(--raio); overflow: hidden; background: #1E1E1E; }
  .video-capa { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; padding: 0; background: #1E1E1E center / cover no-repeat; color: #fff; text-align: left; }
  .video-capa::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.82), rgba(0,0,0,.18) 60%); }
  .video-capa .play { position: absolute; left: 50%; top: 40%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: var(--toca); display: grid; place-items: center; }
  .video-capa .play::after { content: ""; margin-left: 5px; border-style: solid; border-width: 10px 0 10px 16px; border-color: transparent transparent transparent #fff; }
  .video-capa:hover .play { background: var(--toca-escuro); }
  .video-capa .legenda { position: absolute; left: 14px; right: 14px; bottom: 10px; }
  .video-capa .legenda b { display: block; font-size: 15px; line-height: 1.25; }
  .video-capa .legenda span { font-size: 13px; opacity: .85; }
  .video iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; }
  .video-pe { display: flex; justify-content: flex-end; gap: 12px; padding: 7px 12px; background: var(--papel); font-size: 13px; color: var(--suave); }
  .video-pe a { color: var(--suave); }
  .video.sem { background: var(--papel); padding: 14px 16px; font-size: 15px; }
  .video.sem b { display: block; }

  a.video-capa { text-decoration: none; }
  /* Painel */
  .fase-dados.quatro { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .hist { margin-top: 14px; background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio); max-width: 860px; }
  .hist li { display: flex; justify-content: space-between; gap: 16px; padding: 11px 18px; border-top: 1px solid var(--linha); font-size: 15px; }
  .hist li:first-child { border-top: 0; }
  .hist time, .hist .quando { color: var(--suave); font-size: 14px; white-space: nowrap; }
  .vazio { margin-top: 14px; padding: 16px 18px; background: var(--papel); border: 1px dashed #CFCFCF; border-radius: var(--raio); color: var(--suave); max-width: 860px; }
  .diario { margin-top: 14px; max-width: 860px; }
  .diario textarea { display: block; width: 100%; min-height: 120px; padding: 12px 14px; font: inherit; color: var(--tinta); background: var(--papel); border: 1px solid #CFCFCF; border-radius: var(--raio); resize: vertical; }
  .diario .dia { margin-top: 10px; padding: 12px 16px; background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio); white-space: pre-wrap; font-size: 15px; }
  .diario .dia b { display: block; font-size: 13px; font-weight: 400; color: var(--suave); }
  .acoes-painel { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px; }
  .acoes-painel input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .botao.perigo { color: var(--toca); }
  .salvo-info { margin: 18px 20px 0; padding-top: 14px; border-top: 1px solid var(--linha); font-size: 13px; color: var(--suave); line-height: 1.4; }

  .navega { margin-top: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  .aviso-toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); padding: 10px 18px; border-radius: 99px; background: var(--tinta); color: #fff; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; }
  .aviso-toast.visivel { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Telas menores ---------- */
  @media (max-width: 980px) {
    .botao-menu { display: inline-flex; }
    .lateral { transform: translateX(-100%); transition: transform .2s ease; box-shadow: none; }

/* ------------------------- Estado e armazenamento ------------------------- */
const CHAVE = "estoqueToca.progresso.v1";
/* feitos: { "0.1": data em milissegundos }  |  diario: { "2026-11-16": "texto" } */
function normaliza(o) {
  const obj = x => (x && typeof x === "object" && !Array.isArray(x)) ? x : {};
  return { feitos: obj(o.feitos), nome: typeof o.nome === "string" ? o.nome.slice(0, 40) : "", diario: obj(o.diario), salvoEm: +o.salvoEm || 0 };
}
let estado = normaliza({});
let podeSalvar = true;
try {
  const salvo = JSON.parse(localStorage.getItem(CHAVE) || "null");
  if (salvo && typeof salvo === "object") estado = normaliza(salvo);
  localStorage.setItem(CHAVE + ".teste", "1"); localStorage.removeItem(CHAVE + ".teste");
} catch (e) { podeSalvar = false; /* sem armazenamento: o progresso vale só enquanto a página estiver aberta */ }
function salvar() {
  estado.salvoEm = Date.now();
  try { localStorage.setItem(CHAVE, JSON.stringify(estado)); podeSalvar = true; } catch (e) { podeSalvar = false; }
}
/* pede ao navegador para não apagar os dados sozinho quando faltar espaço */
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}

const LOCAL = (() => { try { return location.protocol === "file:"; } catch (e) { return false; } })();
const doisDig = n => String(n).padStart(2, "0");
const chaveDia = (d = new Date()) => `${d.getFullYear()}-${doisDig(d.getMonth() + 1)}-${doisDig(d.getDate())}`;
const diaBonito = k => { const [a, m, d] = k.split("-"); return `${d}/${m}/${a}`; };
function quando(ms) {
  if (!ms || ms === true) return "";
  const d = new Date(ms);
  const dia = chaveDia(d) === chaveDia() ? "hoje" : `${doisDig(d.getDate())}/${doisDig(d.getMonth() + 1)}`;
  return `${dia} às ${doisDig(d.getHours())}:${doisDig(d.getMinutes())}`;
}

const totalFeitos = () => TODOS.filter(p => estado.feitos[p.id]).length;
const proximoPasso = () => TODOS.find(p => !estado.feitos[p.id]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

      ${seguinte ? `<a class="botao principal" href="#fase-${seguinte.n}">Ir para a fase ${seguinte.n}</a>` : ""}
    </div>
  </div>`;
}

/* ------------------------------ Navegação --------------------------------- */
const ROTAS = { inicio: secInicio, telas: secTelas, tutor: secTutor, marca: secMarca, painel: secPainel };
/* A seção aberta fica guardada aqui, e não no endereço da página. Assim a
   navegação funciona em qualquer lugar: Vercel, arquivo aberto do computador
   ou pré-visualização dentro de outra página. */
function rotaValida(h) {
  if (ROTAS[h]) return h;
  const m = String(h).match(/^fase-(\d)$/);
  return m && FASES[+m[1]] ? h : null;
}
function rotaDoEndereco() {
  try { return rotaValida((location.hash || "").slice(1)); } catch (e) { return null; }
}
let rota = rotaDoEndereco() || "inicio";
function rotaAtual() { return rota; }
function vaiPara(nova, irPara) {
  rota = rotaValida(nova) || "inicio";
  try { history.pushState(null, "", "#" + rota); } catch (e) { /* sem acesso ao endereço: segue só em memória */ }
  desenha(irPara);
}

function desenhaMenu() {
  const r = rotaAtual();
  const link = (id, rotulo) => `<a href="#${id}" ${r === id ? 'aria-current="page"' : ""}><span class="rotulo">${rotulo}</span></a>`;
  document.getElementById("menu").innerHTML = `
    <div class="grupo">Comece por aqui</div>
    ${link("inicio", "Início")}
    ${link("telas", "O que você vai construir")}
    ${link("tutor", "Seu tutor")}
    ${link("marca", "Cara da Toca")}
    <div class="grupo">Fases</div>
    ${FASES.map(f => {
      const fz = feitosDa(f), tot = f.passos.length, id = "fase-" + f.n;
      return `<a href="#${id}" class="${fz === tot ? "completa" : ""}" ${r === id ? 'aria-current="page"' : ""}>
        <span class="fase-n">${fz === tot ? "✓" : f.n}</span>
        <span class="rotulo">${esc(f.titulo)}</span>
        <span class="conta">${fz}/${tot}</span></a>`;
    }).join("")}
    <div class="grupo">Acompanhar</div>
    ${link("painel", "Painel")}
    <p class="salvo-info">${podeSalvar
      ? (estado.salvoEm ? "Progresso salvo neste computador, " + quando(estado.salvoEm) + "." : "Seu progresso fica salvo neste computador.")
      : "Este navegador não está salvando o progresso."}</p>`;
}

function desenhaTopo() {
  const fz = totalFeitos(), tot = TODOS.length;
  document.getElementById("contagem").textContent = `${fz} de ${tot} passos`;
  document.getElementById("barraGeral").style.width = Math.round(fz / tot * 100) + "%";
  document.getElementById("marcaTopo").innerHTML = (temLogo
    ? '<img src="logo.png" alt="Toca Imóveis">'
    : '<span class="nome-toca">Toca Imóveis</span>') + '<span class="projeto">Projeto Estoque</span>';
}

function desenha(irPara) {
  const r = rotaAtual();
  const main = document.getElementById("conteudo");
  main.innerHTML = ROTAS[r] ? ROTAS[r]() : secFase(+r.split("-")[1]);
  desenhaMenu();
  desenhaTopo();
  document.body.classList.remove("menu-aberto");
  document.getElementById("abreMenu").setAttribute("aria-expanded", "false");
  const alvo = irPara && document.getElementById("passo-" + irPara.replace(".", "-"));
  if (alvo) alvo.scrollIntoView({ block: "start" });
  else window.scrollTo(0, 0);
}

/* Botão voltar do navegador (quando o endereço está disponível) */
function sincroniza() {
  const r = rotaDoEndereco();
  if (r && r !== rota) { rota = r; desenha(); }
}
window.addEventListener("popstate", sincroniza);
window.addEventListener("hashchange", sincroniza);

/* -------------------------------- Ações ----------------------------------- */
function avisa(texto) {
  const t = document.getElementById("toast");
  t.textContent = texto;
  t.classList.add("visivel");
  clearTimeout(avisa.t);
  avisa.t = setTimeout(() => t.classList.remove("visivel"), 2200);
}
async function copia(texto, ok) {
  try {
    await navigator.clipboard.writeText(texto);
  } catch (e) {
    const a = document.createElement("textarea");
    a.value = texto; a.style.position = "fixed"; a.style.opacity = "0";
    document.body.appendChild(a); a.select();
    try { document.execCommand("copy"); } catch (e2) {}
    a.remove();
  }
  avisa(ok);
}
function resumoProgresso() {
  const fz = totalFeitos(), tot = TODOS.length, prox = proximoPasso();
  const linhas = [
    "Projeto Estoque Toca" + (estado.nome ? " | " + estado.nome : ""),
    `Concluídos: ${fz} de ${tot} passos (${Math.round(fz / tot * 100)}%)`,
    ...FASES.map(f => `Fase ${f.n} (${f.titulo}): ${feitosDa(f)}/${f.passos.length}`),
    prox ? `Próximo passo: ${prox.id} ${prox.t}` : "Trilha concluída"
  ];
  return linhas.join("\n");
}

document.addEventListener("click", e => {
  const interno = e.target.closest('a[href^="#"]');
  if (interno) {
    e.preventDefault();
    vaiPara(interno.getAttribute("href").slice(1), interno.dataset.ir);
    return;
  }
  const el = e.target.closest("[data-tela],[data-copiar],[data-cor],[data-acao],button.video-capa,#abreMenu");
  if (!el) {
    if (document.body.classList.contains("menu-aberto") && !e.target.closest(".lateral")) document.body.classList.remove("menu-aberto");
    return;
  }
  if (el.id === "abreMenu") {
    const aberto = document.body.classList.toggle("menu-aberto");
    el.setAttribute("aria-expanded", String(aberto));
  } else if (el.dataset.acao === "resumo") {
    copia(resumoProgresso(), "Resumo copiado. Cole na mensagem para o gestor.");
  } else if (el.dataset.acao === "baixar") {
    const blob = new Blob([JSON.stringify({ app: "estoque-toca", versao: 1, ...estado }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `progresso-estoque-toca-${chaveDia()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    avisa("Cópia baixada. Guarde o arquivo.");
  } else if (el.dataset.acao === "apagar") {
    if (el.dataset.certeza) {
      estado = normaliza({}); salvar(); desenha();
      avisa("Progresso apagado.");
    } else {
      el.dataset.certeza = "1";
      el.textContent = "Clique de novo para apagar tudo";
      setTimeout(() => { if (el.isConnected) { delete el.dataset.certeza; el.textContent = "Apagar todo o progresso"; } }, 4000);
    }
  } else if (el.dataset.tela) {
    telaAtiva = el.dataset.tela;
    const y = window.scrollY;
    document.getElementById("conteudo").innerHTML = secTelas();
    window.scrollTo(0, y);
    const sel = document.querySelector('[data-tela][aria-selected="true"]');
    if (sel) sel.focus();
  } else if (el.dataset.copiar === "tutor") {
    copia(TUTOR, "Texto copiado. Cole no ChatGPT.");
  } else if (el.dataset.cor) {
    copia(el.dataset.cor, el.dataset.cor + " copiado");
  } else if (el.classList.contains("video-capa")) {
    const caixa = el.parentElement, id = caixa.dataset.video;
    const quadro = document.createElement("iframe");
    quadro.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0`;
    quadro.title = el.getAttribute("aria-label").replace("Assistir: ", "");
    quadro.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    quadro.allowFullscreen = true;
    quadro.referrerPolicy = "strict-origin-when-cross-origin";
    caixa.classList.add("tocando");
    el.replaceWith(quadro);
  }
});

document.addEventListener("change", e => {
  const caixa = e.target.closest("[data-passo]");
  if (caixa) {
    const id = caixa.dataset.passo;
    if (caixa.checked) estado.feitos[id] = Date.now(); else delete estado.feitos[id];
    salvar();
    const li = caixa.closest(".passo");
    li.classList.toggle("feito", caixa.checked);
    li.querySelector(".passo-num").textContent = caixa.checked ? "✓" : id;
    const f = FASES[+id.split(".")[0]];
    const conta = document.getElementById("contaFase");
    if (conta) conta.textContent = `${feitosDa(f)} de ${f.passos.length}`;
    desenhaMenu(); desenhaTopo();
    if (caixa.checked && feitosDa(f) === f.passos.length) avisa(`Fase ${f.n} concluída`);
  }
  if (e.target.id === "arquivoCopia" && e.target.files[0]) {
    const leitor = new FileReader();
    leitor.onload = () => {
      try {
        const dados = JSON.parse(leitor.result);
        if (!dados || dados.app !== "estoque-toca") throw new Error("arquivo de outro tipo");
        estado = normaliza(dados); salvar(); desenha();
        avisa("Progresso restaurado.");
      } catch (erro) { avisa("Este arquivo não é uma cópia do progresso."); }
    };
    leitor.readAsText(e.target.files[0]);
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "nome") { estado.nome = e.target.value.trim().slice(0, 40); salvar(); }
  if (e.target.id === "diarioHoje") {
    const texto = e.target.value.slice(0, 4000);
    if (texto.trim()) estado.diario[chaveDia()] = texto; else delete estado.diario[chaveDia()];
    salvar();
  }
});

/* -------------------------------- Início ---------------------------------- */
const teste = new Image();
teste.onload = () => { temLogo = true; desenha(); };
teste.src = "logo.png";
desenha();
</script>
